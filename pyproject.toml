[project]
name = "patch"
version = "0.1.0"
description = "activation patching in encoder transformers."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "transformers>=4.36",
  "numpy>=1.24",
  "tqdm",
  "gradio>=6,<7",
  "plotly",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.force-include]
"tracer.py" = "tracer.py"
"dataset.py" = "dataset.py"
